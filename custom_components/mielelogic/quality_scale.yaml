# MieleLogic Integration Quality Scale
# Version: 2.6.5
# Target Tier: Gold
# Status: Gold tier substantially complete — integration_test_coverage partial (services.py untested)

rules:
  # ===== BRONZE TIER RULES =====
  
  config_flow:
    status: done
    comment: Full UI configuration via config flow with username, password, client_id, laundry_id, and opening hours
  
  config_flow_test:
    status: done
    comment: tests/test_config_flow.py (2.6.5) covers success, invalid_auth, cannot_connect and duplicate abort. Runs in CI.
  
  dependency_transparency:
    status: done
    comment: No external dependencies required - uses aiohttp from HA core
  
  docs_actions:
    status: exempt
    comment: Integration provides sensors and calendar, not actions/services
  
  docs_config_flow:
    status: done
    comment: README.md documents UI setup process with step-by-step guide
  
  docs_installation:
    status: done
    comment: Installation guide available in README.md and INSTALLATION_GUIDE.md
  
  entity_category:
    status: done
    comment: Diagnostic sensors properly categorized (account balance, etc.)
  
  entity_name:
    status: done
    comment: All entities use has_entity_name=True with modern naming
  
  integration_owner:
    status: done
    comment: Active code owner - KingPainter (GitHub @kingpainter)
  
  parallel_updates:
    status: done
    comment: Uses DataUpdateCoordinator with proper async handling
  
  test_before_setup:
    status: done
    comment: Covered by tests/test_coordinator.py, test_booking_manager.py, test_websocket.py (v2.5.8, pytest-homeassistant-custom-component, runs via GitHub CI)
  
  unique_config_entry:
    status: done
    comment: Unique ID based on username + laundry_id
  
  # ===== SILVER TIER RULES =====
  
  action_exceptions:
    status: exempt
    comment: Integration provides sensors and calendar, not actions/services
  
  config_entry_unloading:
    status: done
    comment: Proper async_unload_entry implemented in __init__.py
  
  device_info:
    status: done
    comment: DeviceInfo properly configured with identifiers, name, manufacturer, model
  
  diagnostics:
    status: done
    comment: diagnostics.py implemented with proper data redaction (v1.3.2+)
  
  docs_describe_entities:
    status: done
    comment: README.md lists all entities with descriptions and examples
  
  docs_installation_method:
    status: done
    comment: HACS and manual installation documented
  
  docs_supported_devices:
    status: done
    comment: README.md documents MieleLogic laundry service compatibility
  
  docs_troubleshooting:
    status: done
    comment: FAQ and troubleshooting section in README.md
  
  entity_unavailable:
    status: done
    comment: Entities properly set unavailable when coordinator update fails
  
  reauthentication_flow:
    status: done
    comment: Automatic token refresh with fallback to password grant
  
  runtime_data:
    status: done
    comment: Uses coordinator stored in hass.data[DOMAIN][entry.entry_id]
  
  inject_websession:
    status: partial
    comment: 2.6.5 uses async_get_clientsession(hass) in coordinator, services and config_flow. Remaining: caldav package in the old client (dead code) - see async_dependency.

  async_dependency:
    status: done
    comment: 2.6.5 caldav_async.py uses aiohttp. caldav removed from manifest. Old caldav_client.py is dead code. Not tested against a real CalDAV server yet.

  strict_typing:
    status: todo
    comment: Add type annotations and mypy strict configuration.

  test_before_configure:
    status: done
    comment: Config flow validates credentials before creating entry
  
  # ===== GOLD TIER RULES (Future) =====
  
  brands:
    status: done
    comment: Local brand icons in custom_components/mielelogic/brand/ (HA 2026.3+ feature, no external home-assistant/brands PR needed — v2.5.8)
  
  common_modules:
    status: done
    comment: Uses standard HA components (sensor, binary_sensor, calendar)
  
  config_entry_reauth_flow:
    status: done
    comment: Automatic re-authentication on token expiry
  
  dhcp:
    status: exempt
    comment: Cloud service - no DHCP discovery possible
  
  discovery:
    status: exempt
    comment: Cloud service requires credentials - no automatic discovery possible
  
  entity_translations:
    status: done
    comment: Full entity translations in da.json + en.json including state values for washer/dryer status sensors
  
  has_entity_description:
    status: done
    comment: All sensors and binary sensors refactored to use EntityDescription dataclasses (v2.0.0)
  
  dynamic_devices:
    status: done
    comment: 2.6.5 machine status sensors are added via a coordinator listener when a new machine number appears (no reload). Not tested on HA yet.

  icon_translations:
    status: done
    comment: 2.6.5 icons.json for all entities with a translation_key. Dynamic icon for washer/dryer availability via state mapping. Machine status sensors keep their own icon (no translation key).

  repair_issues:
    status: done
    comment: 2.6.5 machine inventory change creates a repair issue (issues.machine_inventory_changed, da + en) instead of a persistent notification. Not tested on HA yet.

  integration_test_coverage:
    status: partial
    comment: coordinator.py, booking_manager.py and websocket.py covered (tests/). services.py (validation logic, incl. the reservation-quota check) not yet covered.
  
  reconfiguration_flow:
    status: partial
    comment: Options flow allows changing credentials, calendar, and hours. Laundry ID change planned.
  
  setup_entry_retry:
    status: done
    comment: DataUpdateCoordinator handles retry on setup failure
  
  ssdp:
    status: exempt
    comment: Cloud service - no SSDP discovery possible
  
  translations:
    status: done
    comment: Full translations in da.json + en.json. Config flow, options flow, entity names, and sensor state values all translated.
  
  usb:
    status: exempt
    comment: Cloud service - no USB devices
  
  zeroconf:
    status: exempt
    comment: Cloud service - no Zeroconf discovery possible

# ===== SUMMARY =====
# Bronze tier: ✅ DONE (all required rules met or exempted)
# Silver tier: ✅ DONE (all required rules met or exempted)
# Gold tier: 🟡 SUBSTANTIALLY COMPLETE
#
# Gold tier completed:
#   ✅ entity_translations - state values translated (da + en)
#   ✅ has_entity_description - EntityDescription dataclasses
#   ✅ translations - full coverage da + en
#   ✅ test_before_setup - tests/test_coordinator.py, test_booking_manager.py, test_websocket.py (v2.5.8)
#   ✅ brands - local brand icons (v2.5.8)
#
# Gold tier remaining:
#   🔲 reconfiguration_flow - laundry_id change support
#   🔲 integration_test_coverage - services.py still untested (partial)
#
# Current status: SILVER TIER ✅ | GOLD SUBSTANTIALLY COMPLETE 🟡 (v2.6.5)
